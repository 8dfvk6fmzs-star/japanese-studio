.page));document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());function render(){({home:home,kana:kana,words:wordPage,quiz:quiz,plan:plan})[page]();if(!storageOK&&!document.getElementById('storageNote'))main.insertAdjacentHTML('beforeend','<div class="notice" id="storageNote">当前环境无法持久保存进度，关闭页面后记录可能丢失。</div>')}
function home(){let d=day(),kc=count(state.kana),wc=Object.values(state.words).filter(x=>x==='known').length,completed=Math.min(d.kana.length,5)+Math.min(d.words.length,5)+Math.min(d.quiz,5);main.innerHTML=`<section class="hero"><div class="hero-content"><div class="eyebrow">MY JAPANESE JOURNEY · 01</div><h1>こんにちは。<br>从零开始的日语旅程</h1><p>为四年后的日本修士申请积累语言能力。现在，从假名和日常表达开始。</p><button onclick="nav('kana')">开始今日学习 →</button></div></section><div class="stats"><div class="stat"><small>已掌握假名</small><strong>${kc}<i> / 92</i></strong><div class="bar"><div style="width:${kc/92*100}%"></div></div></div><div class="stat"><small>已记住单词</small><strong>${wc}<i> / 40</i></strong><div class="bar"><div style="width:${wc/40*100}%"></div></div></div><div class="stat"><small>累计答题正确率</small><strong>${state.quizTotal?Math.round(state.quizCorrect/state.quizTotal*100)+'%':'—'}</strong><div class="tiny">${state.quizTotal} 道练习</div></div></div><div class="card"><div class="section-head"><div><h2>今日小目标</h2><p>建议 15–25 分钟，忙时可少做一点。</p></div><span class="badge">${completed}/15</span></div><div class="bar"><div style="width:${completed/15*100}%"></div></div><div class="task"><span class="ticon">あ</span><div class="tasktext"><b>认识或复习 5 个假名</b><small>${Math.min(d.kana.length,5)}/5 · 点读假名即记录</small></div><button onclick="nav('kana')">学习</button></div><div class="task"><span class="ticon">単</span><div class="tasktext"><b>复习 5 个单词</b><small>${Math.min(d.words.length,5)}/5 · 完成卡片自评即记录</small></div><button onclick="nav('words')">背词</button></div><div class="task"><span class="ticon">✓</span><div class="tasktext"><b>完成 5 道练习</b><small>${Math.min(d.quiz,5)}/5 · 答完即记录</small></div><button onclick="nav('quiz')">测验</button></div></div><div class="card"><div class="eyebrow">今日一句 / 今日の一言</div><div class="lesson-jp">日本語を勉強します。</div><div class="muted">にほんごを べんきょうします。 · 我学习日语。</div><button class="quiet" onclick="speak('日本語を勉強します。')">▷ 听发音</button><div class="tiny">を 在这里读作 o，表示动作的宾语。</div></div>`}
function kana(){let list=allKana[script],item=list.find(x=>x&&x.id===selected)||list[0],learned=list.filter(x=>x&&state.kana[x.id]).length;main.innerHTML=`<h1 class="page-title">五十音图</h1><p class="page-desc">先记平假名，再学习片假名。点击任意假名收听发音。</p><div class="tabs"><button class="${script==='h'?'active':''}" onclick="switchKana('h')">平假名 ひらがな</button><button class="${script==='k'?'active':''}" onclick="switchKana('k')">片假名 カタカナ</button></div><div class="card"><div class="section-head"><div><h2>${script==='h'?'平假名':'片假名'}</h2><p>已掌握 ${learned} / 46 个基本假名</p></div></div><div class="detail"><div class="detail-symbol" lang="ja">${item.jp}</div><div class="detail-txt"><b>${item.rom}</b><small>${item.rom==='wo'?'现代日语助词通常读 o':item.rom==='n'?'拨音，单独占一拍':'罗马音仅用于辅助入门'}</small></div><div class="controls"><button class="secondary" onclick="hearSelected()">▷ 听音</button><button class="${state.kana[item.id]?'good':'primary'}" onclick="toggleKana()">${state.kana[item.id]?'✓ 已掌握':'标记掌握'}</button></div></div><div class="kana-grid">${list.map(x=>x?`<button class="kana ${state.kana[x.id]?'learned':''} ${item.id===x.id?'chosen':''}" onclick="pickKana('${x.id}')" aria-label="${x.jp} ${x.rom}"><span class="jp" lang="ja">${x.jp}</span><span class="roma">${x.rom}</span></button>`:'<div class="empty" aria-hidden="true"></div>').join('')}</div><div class="notice">这是 46 个基本假名（两套共 92 个）。浊音、半浊音、拗音、促音和长音将在基础假名之后学习。</div></div><button class="primary" onclick="startMode('${script}')">测试这些假名 →</button>`}function switchKana(s){script=s;selected=s+'-a';kana()}function pickKana(id){selected=id;let x=allKana[script].find(k=>k&&k.id===id);markDay('kana',id);speak(x.jp);kana()}function hearSelected(){let x=allKana[script].find(k=>k&&k.id===selected);if(x){markDay('kana',x.id);speak(x.jp)}}function toggleKana(){if(state.kana[selected])delete state.kana[selected];else state.kana[selected]=true;markDay('kana',selected);kana()}
function deck(){return category==='全部'?words:category==='待复习'?words.filter(w=>state.words[w.id]!=='known'):words.filter(w=>w.cat===category)}function setCat(c){category=c;deckIndex=0;flipped=false;wordPage()}function wordPage(){let a=deck();if(deckIndex>=a.length)deckIndex=0;let w=a[deckIndex];main.innerHTML=`<h1 class="page-title">单词卡片</h1><p class="page-desc">先尝试回忆，再翻卡查看。认识与否由你自己判断。</p><div class="tabs">${categories.map(c=>`<button class="${c===category?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div><div class="card"><div class="section-head"><span class="badge">${w?`${deckIndex+1} / ${a.length} · ${w.cat}`:'已全部掌握'}</span><button class="quiet" onclick="nextWord(-1)" ${w?'':'disabled'}>← 上一张</button></div>${w?`<button class="flash" onclick="flipWord()" aria-label="翻转单词卡"><div class="eyebrow">${flipped?'ANSWER / 答案':'JAPANESE / 日语'}</div><div class="jp" lang="ja">${w.jp}</div>${flipped?`<div class="reading" lang="ja">${w.reading}</div><div class="meaning">${w.zh}</div><div class="example">${w.example}<br>${w.trans}</div>`:'<div class="tiny">点击卡片查看读音与中文</div>'}</button><div class="flash-controls"><button class="secondary" onclick="speak(deck()[deckIndex].reading)">▷ 听音</button><button onclick="judgeWord('review')" ${flipped?'':'disabled'}>还不熟</button><button class="good" onclick="judgeWord('known')" ${flipped?'':'disabled'}>记住了 ✓</button><button class="secondary" onclick="nextWord(1)">跳过 →</button></div><p class="tiny" style="text-align:center">${flipped?'完成自评后自动进入下一张。':'先翻卡，再对记忆情况进行自评。'}</p>`:'<p>这组没有待复习的单词了。可以切换其他分类或进行测试。</p>'}</div><div class="card"><div class="section-head"><h2>本组词汇</h2><span class="tiny">${a.length} 词</span></div><div class="word-list">${a.map(x=>`<div class="word"><div class="w"><strong lang="ja">${x.jp}</strong><small>${x.reading} · ${x.zh}</small></div>${state.words[x.id]==='known'?'<span class="tiny" style="color:#307a68">✓ 已记住</span>':''}<button class="quiet" onclick="speak(words.find(w=>w.id==='${x.id}').reading)" aria-label="朗读 ${x.jp}">▷</button></div>`).join('')}</div></div>`}function flipWord(){flipped=!flipped;wordPage()}function nextWord(n){let a=deck();if(a.length){deckIndex=(deckIndex+n+a.length)%a.length;flipped=false;wordPage()}}function judgeWord(v){let a=deck(),w=a[deckIndex];if(!w||!flipped)return;state.words[w.id]=v;markDay('words',w.id);if(category==='待复习'&&v==='known'){flipped=false;wordPage()}else nextWord(1)}
function pool(m){if(m==='h'||m==='k')return allKana[m].filter(Boolean).map(x=>({id:x.id,prompt:x.jp,answer:x.rom,read:x.jp,mode:m}));return words.map(w=>({id:w.id,prompt:w.jp,answer:w.zh,read:w.reading,mode:'w'}))}function allQuestions(){return [...pool('h'),...pool('k'),...pool('w')]}function begin(){let a=quizMode==='wrong'?allQuestions().filter(x=>state.wrong.includes(x.id)):pool(quizMode);if(!a.length){toast('暂无错题，先做一次普通测试吧');return}session={items:shuffle(a).slice(0,10).map(q=>({...q,choices:shuffle([q.answer,...shuffle([...new Set(pool(q.mode).map(y=>y.answer).filter(y=>y!==q.answer))]).slice(0,3)])})),index:0,correct:0,chosen:null,errors:[]};quiz()}function startMode(m){quizMode=m;session=null;nav('quiz');begin()}function quiz(){let s=session;main.innerHTML=`<h1 class="page-title">练习测试</h1><p class="page-desc">每轮最多 10 题，做错的题会进入错题复习。</p><div class="card"><div class="controls"><select aria-label="练习范围" onchange="quizMode=this.value;session=null;quiz()"><option value="h" ${quizMode==='h'?'selected':''}>平假名 → 罗马音</option><option value="k" ${quizMode==='k'?'selected':''}>片假名 → 罗马音</option><option value="w" ${quizMode==='w'?'selected':''}>单词 → 中文</option><option value="wrong" ${quizMode==='wrong'?'selected':''}>错题复习 (${state.wrong.length})</option></select><button class="primary" onclick="begin()">${s?'重新开始':'开始测试'}</button></div></div>${!s?'<div class="card"><h2>准备好了就开始</h2><p class="sub">第一次先选平假名。测试不是考试，只是寻找还需要复习的地方。</p></div>':s.index>=s.items.length?`<div class="card" style="text-align:center"><div class="eyebrow">RESULT / 测试结果</div><div style="font-size:49px;font-weight:750;margin:12px 0">${s.correct}/${s.items.length}</div><p>${s.correct===s.items.length?'本轮全部答对！':'完成本轮练习。下面是需要复习的内容。'}</p>${s.errors.map(q=>`<div class="lesson-row">${q.prompt} → ${q.answer}</div>`).join('')}<button class="primary" onclick="begin()">再练一轮</button></div>`:quizQuestion(s)}`}
function quizQuestion(s){let q=s.items[s.index],chosen=s.chosen;return `<div class="card"><div class="section-head"><span class="badge">第 ${s.index+1} / ${s.items.length} 题</span><span class="tiny">已答对 ${s.correct} 题</span></div><div class="bar"><div style="width:${(s.index+(chosen!==null?1:0))/s.items.length*100}%"></div></div><div class="quiz-prompt" lang="ja">${q.prompt}</div><p class="sub" style="text-align:center;margin-bottom:15px">${q.mode==='w'?'选择中文意思':'选择正确的罗马音'}</p><div class="choices">${q.choices.map((c,i)=>`<button ${chosen!==null?'disabled':''} class="choice ${chosen!==null&&c===q.answer?'correct':chosen===i?'wrong':''}" onclick="answer(${i})">${c}</button>`).join('')}</div><div class="feedback" aria-live="polite">${chosen===null?'':q.choices[chosen]===q.answer?'✓ 回答正确！':'正确答案：'+q.answer+'。已加入错题。'}</div>${chosen!==null?`<div class="controls"><button class="secondary" onclick="speak(session.items[session.index].read)">▷ 听发音</button><button class="primary" onclick="session.index++;session.chosen=null;quiz()">${s.index===s.items.length-1?'查看结果':'下一题 →'}</button></div>`:''}</div>`}function answer(i){let s=session;if(!s||s.chosen!==null||s.index>=s.items.length)return;let q=s.items[s.index];s.chosen=i;state.quizTotal++;if(q.choices[i]===q.answer){s.correct++;state.quizCorrect++;if(quizMode==='wrong')state.wrong=state.wrong.filter(x=>x!==q.id)}else{s.errors.push(q);if(!state.wrong.includes(q.id))state.wrong.push(q.id)}markDay('quiz');quiz()}
function plan(){main.innerHTML=`<h1 class="page-title">我的学习路线</h1><p class="page-desc">留学是长期目标，先把当前阶段的基础学扎实。</p><div class="card"><div class="section-head"><h2>第一个月 · 零基础入门</h2><span class="badge">建议安排</span></div><div class="week"><h3>第 1 周 · 平假名</h3><p>每天学习 5–10 个基本假名，听音、跟读、默写；逐步学完 46 个。</p></div><div class="week"><h3>第 2 周 · 片假名</h3><p>学习 46 个片假名，每天穿插复习平假名。</p></div><div class="week"><h3>第 3 周 · 读音规则</h3><p>使用教材学习浊音、半浊音、拗音、促音、长音；开始积累基础词汇。</p></div><div class="week"><h3>第 4 周 · 简单句子</h3><p>开始学习「です」「ます」、助词「は」「を」「か」等，练习自我介绍。</p></div><div class="notice">这个网页是第一阶段的辅助工具，不包含完整 N5 语法课。结合入门教材和标准音频学习更稳妥。</div></div><div class="card"><h2>基础句型 · 迷你课堂</h2><div class="lesson-row"><p class="lesson-jp">私は学生です。</p><p>我是学生。<span class="tiny">｜は 作助词时读 wa；です 是礼貌表达。</span></p><button class="quiet" onclick="speak('私は学生です。')">▷ 听音</button></div><div class="lesson-row"><p class="lesson-jp">日本語を勉強します。</p><p>我学习日语。<span class="tiny">｜を 标记宾语；ます 是礼貌动词形式。</span></p><button class="quiet" onclick="speak('日本語を勉強します。')">▷ 听音</button></div><div class="lesson-row"><p class="lesson-jp">これは何ですか。</p><p>这是什么？<span class="tiny">｜か 放句末表示疑问。</span></p><button class="quiet" onclick="speak('これは何ですか。')">▷ 听音</button></div></div><div class="card"><h2>本科四年 · 长期方向</h2><div class="week"><h3>大一 · N5 → N4 基础</h3><p>以转专业备考为优先，保持稳定的日语学习习惯。</p></div><div class="week"><h3>大二 · 向 N3 进阶</h3><p>建立语法、阅读和听力能力，逐步提高真实语境理解。</p></div><div class="week"><h3>大三 · 向 N2 进阶</h3><p>开始读学术及电子信息相关词汇，了解目标院校的语言要求。</p></div><div class="week"><h3>大四 · 申请与考试准备</h3><p>依据目标研究科要求准备语言成绩、专业考试、研究计划及面试，按需要冲刺 N1。</p></div><p class="tiny">上述等级与时间是可调整目标，不是保证达到或统一的修士申请要求。</p></div><div class="card"><h2>学习数据</h2><p class="sub">进度存储在当前浏览器，没有账号或服务器。更换设备、使用隐私浏览或清除站点数据可能导致进度丢失。</p><div class="controls" style="margin-top:14px"><button class="secondary" onclick="exportProgress()">导出进度备份</button><button class="quiet" onclick="resetProgress()">清空学习记录</button></div></div><div class="foot">Japanese Studio · 自主学习小工具 · 语音由系统浏览器提供，可能因设备而异。</div>`}function resetProgress(){if(confirm('确定清空所有假名、词汇和测试记录？此操作无法撤销。')){state=emptyState();session=null;save();render();toast('学习记录已清空')}}function exportProgress(){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='japanese-progress-'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
